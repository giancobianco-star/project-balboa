name: Embed Project Balboa i18n

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  embed-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed translation engine in index
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          js = Path('assets/i18n.js').read_text(encoding='utf-8')
          s = index.read_text(encoding='utf-8')
          replacement = '<script>\n' + js.replace('</script>', '<\\/script>') + '\n</script>'

          tags = [
              '<script src="assets/i18n.js"></script>',
              '<script src="assets/i18n.js?v=20260902-2"></script>'
          ]

          changed = False
          for tag in tags:
              if tag in s:
                  s = s.replace(tag, replacement, 1)
                  changed = True
                  break

          if changed:
              index.write_text(s, encoding='utf-8')
              print('Embedded translation engine successfully.')
          else:
              print('Translation engine is already embedded or script tag was not found.')
          PY
      - name: Commit embedded translation engine
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed bilingual translation engine"
          git push
