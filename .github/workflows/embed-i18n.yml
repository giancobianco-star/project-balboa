name: Embed Project Balboa i18n

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  embed-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed translation engine in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html')
          js = Path('assets/i18n.js').read_text(encoding='utf-8')
          s = index.read_text(encoding='utf-8')
          pattern = r'<script\s+src="assets/i18n\.js(?:\?[^\"]*)?"></script>'
          replacement = '<script>\n' + js.replace('</script>', '<\\/script>') + '\n</script>'
          new, count = re.subn(pattern, replacement, s, count=1)
          if count == 0:
              print('Translation engine is already embedded or script tag was not found.')
          else:
              index.write_text(new, encoding='utf-8')
              print('Embedded translation engine successfully.')
          PY
      - name: Commit embedded translation engine
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Embed bilingual translation engine"
          git push
