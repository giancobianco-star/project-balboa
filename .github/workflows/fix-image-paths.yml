name: Fix Project Balboa image paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point HTML directly to WebP assets
        run: |
          sed -i 's#assets/hero-panama\.svg#assets/hero-panama.webp#g' index.html
          sed -i 's#assets/trust-vault\.svg#assets/trust-vault.webp#g' index.html
          sed -i 's#assets/payments-cafe\.svg#assets/payments-cafe.webp#g' index.html
          sed -i 's#assets/canal-logistics\.svg#assets/canal-logistics.webp#g' index.html

      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo 'No image-path changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix image loading on GitHub Pages'
          git push
