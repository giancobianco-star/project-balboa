name: Publish verified Project Balboa bilingual engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify clean translation engine syntax
        run: node --check assets/i18n.js
      - name: Replace broken embedded engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          markers=['<script>\n(()=>{\nconst EN={','<script>\n(() => {\n  \'use strict\';\n\n  const EN = {']
          start=-1
          for marker in markers:
              start=s.find(marker)
              if start!=-1:
                  break
          if start==-1:
              raise SystemExit('Embedded i18n block not found')
          end=s.find('</script>',start)
          if end==-1:
              raise SystemExit('Closing script tag not found')
          end+=len('</script>')
          replacement='<script src="assets/i18n.js?v=20260902-verified"></script>'
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          print('Replaced broken inline engine with verified asset.')
          PY
      - name: Install jsdom
        run: npm install --no-save jsdom
      - name: Verify actual English DOM rendering
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM,VirtualConsole}=require('jsdom');
          let html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('assets/i18n.js','utf8');
          html=html.replace(/<script src="assets\/i18n\.js[^\"]*"><\/script>/,`<script>${js.replace(/<\/script>/gi,'<\\/script>')}</script>`);
          const vc=new VirtualConsole();
          vc.on('jsdomError',e=>console.error('JSDOM ERROR:',e.message));
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,url:'https://project-balboa.github.io/?lang=en',virtualConsole:vc,beforeParse(window){window.IntersectionObserver=class{observe(){} disconnect(){}};}});
          setTimeout(()=>{
            const h1=dom.window.document.querySelector('h1')?.textContent.trim();
            const lang=dom.window.document.documentElement.lang;
            const en=dom.window.document.getElementById('langEn');
            console.log('HTML LANG:',lang);
            console.log('EN ACTIVE:',en?.classList.contains('active'));
            console.log('H1:',h1);
            if(lang!=='en'||!en?.classList.contains('active')||h1!=='Panama does not need a new currency.') process.exit(1);
          },500);
          NODE
      - name: Commit verified page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish verified English language toggle"
          git push
