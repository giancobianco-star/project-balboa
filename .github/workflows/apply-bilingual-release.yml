name: Apply bilingual Project Balboa release

on:
  push:
    paths:
      - 'tools/bilingual_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply bilingual patch
        run: python tools/bilingual_patch.py
      - name: Commit release
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish bilingual Project Balboa v1.0"
          git push
